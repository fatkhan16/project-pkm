<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman Siswa - Sistem Informasi Nilai Siswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Seluruh halaman disembunyikan sampai pengecekan login selesai (lihat auth.js) -->
  <div id="app" hidden>

    <header class="app-header">
      <div class="header-info">
        <h1>Nilai Saya</h1>
        <p class="header-line"><strong id="header-name"></strong> (Siswa)</p>
        <p class="header-line"><span id="header-class"></span> · <span id="header-semester"></span></p>
      </div>
      <button type="button" class="btn btn-light" id="logout-btn">Keluar</button>
    </header>

    <main class="container">

      <!-- Tampilan: memuat -->
      <p class="state-box" data-view="loading" role="status">Memuat nilai...</p>

      <!-- Tampilan: error -->
      <div class="state-box state-error" data-view="error" role="alert" hidden>
        <p id="error-text">Terjadi kesalahan.</p>
        <button type="button" class="btn btn-primary" id="retry-btn">Coba lagi</button>
      </div>

      <!-- Tampilan: belum ada nilai -->
      <p class="state-box" data-view="empty" hidden>Belum ada nilai</p>

      <!-- Tampilan: isi -->
      <div data-view="content" hidden>

        <p class="muted" id="grade-info"></p>

        <!-- Ringkasan -->
        <section class="summary" aria-labelledby="summary-title">
          <h2 id="summary-title">Ringkasan</h2>
          <div class="summary-grid summary-grid-2">
            <div class="summary-item">
              <span class="summary-label">Rata-rata nilai akhir</span>
              <span class="summary-value" id="sum-average">—</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Mapel tuntas</span>
              <span class="summary-value" id="sum-pass">—</span>
            </div>
          </div>
          <p class="muted" id="sum-note"></p>
        </section>

        <!-- Daftar nilai (read-only) -->
        <div id="table-wrap">
          <table class="grade-table">
            <caption class="visually-hidden">Daftar nilai per mata pelajaran</caption>
            <thead></thead>
            <tbody id="grade-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/siswa.js"></script>
</body>
</html>
