<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Sistem Informasi Nilai Siswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <main class="login-box">
    <h1>Sistem Informasi Nilai Siswa</h1>
    <p class="muted" id="semester-text"></p>

    <!-- Form login -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autocapitalize="none" aria-describedby="username-error">
        <p class="field-error" id="username-error" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               aria-describedby="password-error">
        <p class="field-error" id="password-error" hidden></p>
      </div>

      <p class="alert alert-error" id="login-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Masuk</button>
    </form>

    <!-- Akun demo -->
    <section class="demo-box" id="demo-accounts" aria-labelledby="demo-title">
      <h2 id="demo-title">Akun demo</h2>
      <p class="muted">Klik salah satu akun untuk mengisi form.</p>

      <p class="demo-label">Guru (password: guru123)</p>
      <div class="chip-list" id="demo-teachers"></div>

      <details>
        <summary>Siswa (password: siswa123)</summary>
        <div class="chip-list" id="demo-students"></div>
      </details>
    </section>

    <!-- Reset data -->
    <div class="reset-box">
      <button type="button" class="btn btn-small" id="reset-btn">Reset data demo</button>
      <p class="muted" id="reset-message" role="status" hidden></p>
    </div>
  </main>

  <!-- Urutan script penting: config -> data -> utils -> api -> auth -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("semester-text").textContent = CONFIG.SEMESTER_LABEL;
    Auth.initLoginPage();
  </script>
</body>
</html>
