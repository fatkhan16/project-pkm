<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SMA Kebangsaan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body id="login-body">
    <div id="login-page-wrapper">
      <h1>SMA Kebangsaan</h1>

      <!-- 1. Menambahkan pesan error global yang tersembunyi -->
      <div
        id="login-error"
        style="color: #ffcccc; font-size: 0.9rem; margin-bottom: 1rem"
        hidden
      ></div>

      <!-- 2. Mengubah ID form agar sesuai dengan auth.js -->
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
          <!-- Menambahkan ID untuk pesan error username -->
          <div
            id="username-error"
            style="
              color: #ffcccc;
              font-size: 0.85rem;
              margin-top: 0.25rem;
              text-align: left;
            "
            hidden
          ></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
          <!-- Menambahkan ID untuk pesan error password -->
          <div
            id="password-error"
            style="
              color: #ffcccc;
              font-size: 0.85rem;
              margin-top: 0.25rem;
              text-align: left;
            "
            hidden
          ></div>
        </div>

        <!-- 3. Menambahkan ID login-btn -->
        <button type="submit" id="login-btn" class="btn btn-primary">
          Masuk
        </button>
      </form>

      <a href="#" class="forgot-password-link" onclick="openModal(event)"
        >Lupa sandi?</a
      >
    </div>

    <div
      id="forgotPasswordModal"
      class="modal-overlay"
      onclick="closeModalOutside(event)"
    >
      <div class="modal-content">
        <h2>Lupa Kata Sandi?</h2>
        <p>
          Silakan hubungi Admin Tata Usaha atau Wali Kelas Anda untuk meminta
          reset kata sandi.
        </p>
        <a
          href="https://wa.me/6281234567890"
          target="_blank"
          class="btn btn-whatsapp"
          >Hubungi Admin via WhatsApp</a
        >
        <button
          type="button"
          class="btn btn-light btn-block"
          onclick="closeModal()"
        >
          Tutup
        </button>
      </div>
    </div>

    <!-- 4. WADAH TERSEMBUNYI (PENTING) -->
    <!-- Elemen ini disembunyikan agar desain tetap bersih, tapi wajib ada agar auth.js tidak error saat mencari ID ini -->
    <div style="display: none">
      <div id="demo-accounts"></div>
      <div id="demo-teachers"></div>
      <div id="demo-students"></div>
      <button id="reset-btn"></button>
      <div id="reset-message"></div>
    </div>

    <script>
      function openModal(e) {
        e.preventDefault();
        document.getElementById("forgotPasswordModal").style.display = "flex";
      }
      function closeModal() {
        document.getElementById("forgotPasswordModal").style.display = "none";
      }
      function closeModalOutside(e) {
        if (e.target.id === "forgotPasswordModal") {
          closeModal();
        }
      }
    </script>

    <!-- 5. MEMANGGIL JAVASCRIPT -->
    <!-- Masukkan file pendukung sebelum auth.js (sesuaikan dengan yang Anda punya) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // Memulai fungsi form login dari auth.js setelah halaman dimuat
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof Auth !== "undefined" && Auth.initLoginPage) {
          Auth.initLoginPage();
        }
      });
    </script>
  </body>
</html>
